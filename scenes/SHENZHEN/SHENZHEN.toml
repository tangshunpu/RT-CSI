[extent]
min_lon = 114.043000
min_lat = 22.532000
max_lon = 114.056800
max_lat = 22.545000

[paths]
data_dir = "../output/SHENZHEN_SKYLINE"
export_filename = "SHENZHEN_SKYLINE.xml"
blend_filename = "SHENZHEN_SKYLINE.blend"
osm_file = "../output/SHENZHEN_SKYLINE/osm/map.osm"
blosm_zip = "../vendor/addons/blosm-release-2.7.26.zip"
mitsuba_blender_zip = "../vendor/addons/mitsuba-blender-v0.4.0-blender45.zip"

[addons]
blosm_modules = ["blosm"]
mitsuba_modules = ["mitsuba-blender", "mitsuba_blender", "mitsuba"]

[import]
terrain = true
osm = true
water = false
forests = false
vegetation = true
highways = true
railways = false
single_object = false
osm_mode = "3Dsimple"

[materials]
roof = "itu_metal"
wall = "itu_concrete"
terrain = "itu_wet_ground"
vegetation = "itu_wood"
road = "itu_concrete"
default = "itu_concrete"

[postprocess]
sanitize_names = true
triangulate = true
recenter_xy = true
add_face_normals = true
cleanup_blosm_cache = false

[view]
add_camera = true
camera_position = [0.0, -700.0, 420.0]
camera_look_at = [0.0, 0.0, 120.0]
add_sun = true
