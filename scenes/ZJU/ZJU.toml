[extent]
min_lon = 120.109700
min_lat = 30.259500
max_lon = 120.124300
max_lat = 30.273200

[paths]
data_dir = "../output/ZJU"
export_filename = "ZJU.xml"
blend_filename = "ZJU.blend"
blosm_zip = "../vendor/addons/blosm-release-2.7.26.zip"
mitsuba_blender_zip = "../vendor/addons/mitsuba-blender-v0.4.0-blender45.zip"

[addons]
blosm_modules = ["blosm"]
mitsuba_modules = ["mitsuba-blender", "mitsuba_blender", "mitsuba"]

[import]
terrain = true
osm = true
water = true
forests = true
vegetation = true
highways = true
railways = false
single_object = false
osm_mode = "3Dsimple"

[materials]
roof = "itu_metal"
wall = "itu_concrete"
terrain = "itu_wet_ground"
water = "itu_wet_ground"
vegetation = "itu_wood"
road = "itu_concrete"
default = "itu_concrete"

[postprocess]
sanitize_names = true
triangulate = true
recenter_xy = true
add_face_normals = true
cleanup_blosm_cache = false

[view]
add_camera = true
camera_position = [0.0, -450.0, 260.0]
camera_look_at = [0.0, 0.0, 0.0]
add_sun = true
